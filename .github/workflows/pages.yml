name: Deploy games to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out games
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Check game physics and result codes
        run: node --test tests/*.test.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Prepare site
        run: |
          mkdir .site
          cp index.html .site/
          cp -R css js .site/
      - name: Upload site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy games
        id: deployment
        uses: actions/deploy-pages@v5.0.1
